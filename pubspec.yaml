name: demo_earthly
description: "Earthly Jewels - Flutter App matching Shopify store design"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # UI & Fonts
  google_fonts: ^6.1.0
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.9
  shimmer: ^3.0.0
  smooth_page_indicator: ^1.1.0
  carousel_slider: ^5.0.0
  marquee: ^2.3.0
  lottie: ^3.3.1
  photo_view: ^0.15.0
  file_picker: ^10.3.2
  flutter_custom_tabs: ^2.4.0

  path_provider: ^2.1.5
  mobx: ^2.5.0
  flutter_mobx: ^2.3.0

  # State Management
  provider: ^6.1.1

  # Networking
  http: ^1.1.0

  # Utils
  url_launcher: ^6.2.5
  shared_preferences: ^2.3.0
  share_plus: ^10.1.0
  video_player: ^2.9.2
  nb_utils: ^7.0.0
  flutter_stripe: ^10.1.0
  animations: ^3.0.0
  flutter_animate: ^4.5.0
  flutter_spinkit: ^5.2.1
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  mobx_codegen: ^2.7.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/videos/
